[workspace]
resolver = "2"
members = ["crates/vpet-core", "crates/vpet-storage", "crates/vpet-llm", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Release builds ship compiled, stripped native code only.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
# Unwind (not abort): a fault in one thread or command must not close the
# whole app; locks are recovered after a panic (see `lock` in lib.rs).
panic = "unwind"

# llama.cpp is unusably slow unoptimised; keep it fast in dev builds too.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
debug = false

[profile.dev.package.llama-cpp-2]
opt-level = 3

[profile.dev.package.vpet-llm]
opt-level = 3
